name: Backend Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "apps/backend/**"
      - "packages/types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - run: npm run prisma:validate -w @safaar/backend
      - run: npm run typecheck -w @safaar/backend
      - run: npm run format:check -w @safaar/backend
      - run: npm run lint -w @safaar/backend
      - run: npm audit --workspace=@safaar/backend --audit-level=critical
      - run: npm run test:backend
      - run: npm run build:backend

  deploy:
    needs: checks
    runs-on: [self-hosted, safaar-backend]
    steps:
      - name: SSH agent sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Server host key'ini tanish
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Serverda deploy qilish
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin develop
            git reset --hard origin/develop
            npm ci
            npm run build:backend
            pm2 restart safaar-backend --update-env
            pm2 save
          '

      - name: Sog'liqni tekshirish (smoke test)
        run: |
          sleep 5
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            echo "-- /v1/health --"
            curl -sf http://127.0.0.1:4000/v1/health
            echo
            echo "-- /v1/auth/providers --"
            curl -sf http://127.0.0.1:4000/v1/auth/providers
            echo
            echo "-- pm2 status --"
            pm2 jlist | node -e "
              const p = JSON.parse(require(\"fs\").readFileSync(0, \"utf8\"));
              const app = p.find((x) => x.name === \"safaar-backend\");
              if (!app || app.pm2_env.status !== \"online\") {
                console.error(\"safaar-backend is not online\");
                process.exit(1);
              }
              console.log(\"safaar-backend PM2 status: online\");
            "
          '
