name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/types/**"
      - "package.json"
      - "package-lock.json"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - run: npm run prisma:validate -w @safaar/backend
      - run: npm run typecheck -w @safaar/backend
      - run: npm run format:check -w @safaar/backend
      - run: npm run lint -w @safaar/backend
      - run: npm audit --workspace=@safaar/backend --audit-level=critical
      - run: npm run test:backend
      - run: npm run build:backend

  docker-build:
    name: Docker image build + scan (devops/xavfsizlik)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (push qilinmaydi — faqat buzilmaganini tekshirish)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: safaar-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image'ni Trivy bilan skanerlash (OS/paket zaifliklari)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: safaar-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Trivy natijalarini Security tab'ga yuklash
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
